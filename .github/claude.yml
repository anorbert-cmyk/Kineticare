# ============================================================================
# Kineticare – Claude Code integráció (@claude megemlítés issue/PR-kommentben)
# ----------------------------------------------------------------------------
# Amikor valaki @claude-t ír egy issue- vagy PR-kommentbe, a Claude Code
# GitHub Action elindul, és a repó kontextusával (CLAUDE.md tilos zónák!)
# dolgozik a kérésen.
#
# ELŐFELTÉTEL (egyszeri, admin):
#   1) A Claude GitHub App telepítve legyen a repóra
#      (https://github.com/apps/claude → Install)
#   2) Repo secret:  ANTHROPIC_API_KEY  (Settings → Secrets and variables
#      → Actions → New repository secret)
# A workflow titkot NEM tartalmaz — a kulcs a GitHub-titoktárolóban él.
# ============================================================================

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Csak akkor fut, ha a komment/issue törzse tartalmazza a @claude említést.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
