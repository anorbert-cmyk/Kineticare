# Dependabot-konfiguráció – Kineticare
#
# T-072 politika (PINNELT payload-verziók):
#   A @payloadcms/* és payload csomagok pontos verzióra vannak pinelve (^ TILOS),
#   mert a plugin-ecommerce és a core közötti API-változások törhetik a buildet.
#   Ezek frissítése NEM automatikus: csak changelog elolvasása + staging E2E
#   teszt sikeres lefutása után, emberi döntéssel történhet.
#   Ezért a Dependabot ezekre a csomagokra NEM nyit auto-PR-t (ignore).

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # T-072: pinnelt payload-csomagok – frissítés csak manuálisan
      # (changelog-olvasás + staging-E2E után, emberi döntéssel).
      - dependency-name: "@payloadcms/*"
      - dependency-name: "payload"
      # A payload@3.86.x peer-dependency-je graphql ^16.8.1 – a v17-es major
      # vonalat a Dependabot ne nyissa újra, amíg a Payload nem támogatja.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # 2-ről 5-re emelve: a 2-es limit mellett a #15/#16 (checkout, gitleaks)
    # kitöltötte a keretet, és a setup-node Node 20-as runtime-emelése
    # (2026-09-16-i kivezetési határidő!) PR nélkül maradt. Az 5-ös keret
    # a repó összes actionjének (checkout, setup-node, gitleaks,
    # claude-code-action) egyidejű major-emelését is elbírja.
    open-pull-requests-limit: 5
    labels:
      - dependencies
